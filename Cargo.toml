[package]
name = "cosmic-ext-fonts"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "Fonts — browse, preview, install and remove fonts on the COSMIC™ desktop"
repository = "https://github.com/LinuxBoy-96/cosmic-ext-fonts"

[workspace]
members = ["fonts-core"]

[dependencies]
fonts-core = { path = "fonts-core" }

dirs = "7"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
tokio = { version = "1", features = ["fs", "rt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Pinned: libcosmic has no releases and its API moves weekly. Bump deliberately.
rev = "c003a58fff660f5c55ebfb54a5908722fa7d1d6e"
# Wayland only, drawn on the CPU (no wgpu), plus the portal for the file chooser and links.
default-features = false
features = [
    "a11y",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
    "xdg-portal",
]
