# Points every source of Cargo.lock at debian/vendor (made by `cargo vendor debian/vendor`).
# debian/rules passes it with `--config`. Update it when Cargo.lock changes a git source:
# `cargo vendor` prints the block.

[source.crates-io]
replace-with = "vendored-sources"

[source."git+https://github.com/RustCrypto/rustls-rustcrypto.git?rev=70f76c039e587192688af18a80d5d6435dedaf22"]
git = "https://github.com/RustCrypto/rustls-rustcrypto.git"
rev = "70f76c039e587192688af18a80d5d6435dedaf22"
replace-with = "vendored-sources"

